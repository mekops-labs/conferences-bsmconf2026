[tools]
"npm:@marp-team/marp-cli" = "4.5.1"

[tasks.slides]
description = "Render the slide deck to a standalone HTML file (open in any browser)"
run = """
marp slides/deck.md --theme-set slides/mekops.css -o slides/deck.html --html
slides/embed-images.sh deck.html
"""

[tasks.slides-pdf]
description = "Render the slide deck to a standalone PDF"
run = "marp slides/deck.md --theme-set slides/mekops.css -o slides/deck.pdf --pdf"
