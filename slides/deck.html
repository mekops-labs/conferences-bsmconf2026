<h1 id="where-the-chain-of-trust-goes-dark">Where the Chain of Trust Goes Dark</h1>
<h3 id="extending-verified-boot-to-signed-webassembly-workloads-on-microcontrollers">Extending verified boot to signed WebAssembly workloads on microcontrollers</h3>
</div>
<br /><br /><br /><br /><br /><br />
<div style="text-align:right">
<p><strong>Kamil Wcisło</strong> — Boot Security Mastery 2026, Gdańsk</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="2" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="verified-boot-is-solved-on-paper">Verified boot is solved on paper</h2>
<ul>
<li>A hardware root of trust measures and authorizes each stage — bootrom →
bootloader → <strong>application image</strong>.</li>
<li>Then the chain <strong>terminates at the application</strong>.</li>
<li>Everything the application loads <strong>afterward</strong> runs unverified.</li>
</ul>
<h2 id="the-devices-that-matter-load-code-after-boot">The devices that matter, load code after boot</h2>
<p>OTA firmware modules, plugins, updatable logic. For a fleet of internet-facing
microcontrollers, <em>that</em> is the attack surface — and it sits <strong>outside</strong> the
boot-security envelope.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="3" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="thesis">Thesis</h2>
<blockquote>
<p>On devices that run code they download, the <strong>chain of trust is only as long
as the runtime makes it.</strong></p>
</blockquote>
<h2 id="question">Question</h2>
<blockquote>
<p>How to secure small targets in a portable manner?</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="4" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="webassembly-101">WebAssembly 101</h2>
<p>Not a language - a <strong>compile target</strong>: C, Rust, Zig and others compile <strong>to</strong>
it, and a <strong>small virtual machine executes it</strong>. Three properties do the
security work and none of them depend on an OS.</p>
<ol>
<li><strong>Memory is one flat array the module owns</strong> - addressed to module's own
linear memory, every access is bounds-checked.<br /><em>A pointer into the host, the
runtime's own structures, or a neighbour is not forbidden, it is <strong>not
expressible</strong></em>.</li>
<li><strong>The call stack is not in that memory</strong> - return addresses live in the VM,
out of reach. Overflow a buffer and you corrupt only the module's own data.</li>
<li><strong>No ambient authority</strong> - a module can call only the functions imported
into it. There is no syscall table to reach for.</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="5" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="against-the-thing-you-probably-already-know">Against the thing you probably already know</h2>
<table>
<thead>
<tr>
<th></th>
<th>Container</th>
<th>Wasm module</th>
</tr>
</thead>
<tbody>
<tr>
<td>Boundary</td>
<td>the <strong>kernel</strong></td>
<td>the <strong>instruction set</strong></td>
</tr>
<tr>
<td>Shares</td>
<td>kernel, environment</td>
<td><strong>nothing</strong></td>
</tr>
<tr>
<td>Host access</td>
<td>syscalls (minus filtered)</td>
<td>imported funcs</td>
</tr>
<tr>
<td>Memory</td>
<td>MMU-controlled address space</td>
<td>bounds-checked array</td>
</tr>
<tr>
<td>To escape</td>
<td>kernel bug or a loose cap</td>
<td>a bug in the runtime</td>
</tr>
<tr>
<td>Requires</td>
<td>MMU and Linux</td>
<td><strong>neither</strong></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="6" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="against-the-thing-you-probably-already-know-cont">Against the thing you probably already know, cont.</h2>
<p>The deepest difference is <strong>the default</strong>:</p>
<ul>
<li>a container starts with <strong>everything and you take things away</strong></li>
<li>a module starts with <strong>nothing and you hand things in</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="7" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="what-that-buys-and-what-it-does-not">What that buys, and what it does not</h2>
<p>Wasm itself only isolates a module <strong>inside</strong> a process. That is a real
boundary, and it is silent about two things.</p>
<table>
<thead>
<tr>
<th>Wasm answers</th>
<th>Wasm says nothing about</th>
</tr>
</thead>
<tbody>
<tr>
<td>Can this code tries to reach memory it <strong>does not own</strong>?</td>
<td>Where did this code <strong>come from</strong>?</td>
</tr>
<tr>
<td>Can it call something it was <strong>not given</strong>?</td>
<td>What is it <strong>allowed to touch</strong> on this device?</td>
</tr>
</tbody>
</table>
<p>Isolation is not provenance, and it is not authority - perfectly sandboxed
module of unknown origin, granted everything, is still a bad day.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="8" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="lets-try-to-answer-all">Let's try to answer all</h2>

<td style="border:none; padding:0 1.5em 0 0">
<div style="text-align:center">

</div>
</td>

</style>
<p>OSS runtime for ARM/RISC-V/Xtensa/x86 (and possibly
others) - treats the post-boot gap as a first-class boot-security problem.</p>
<ul>
<li><strong>engine</strong> — one process; a Wasm interpreter (<strong>WAMR</strong>) and a filesystem
router</li>
<li><strong>wapp</strong> — an <strong>OCI image</strong> with Wasm module + ro filesystem with static data</li>
<li><strong>supervisor</strong> — a privileged wapp that reconciles what the engine runs
against <strong>signed desired state</strong></li>
<li><strong>control plane</strong> — signs that state, supervisor verifies it</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="9" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="lets-try-to-answer-all-cont">Let's try to answer all, cont.</h2>
<p><strong>What it adds on top of Wasm:</strong></p>
<ul>
<li><strong>provenance</strong> — images signed and checked at every load - <em>do we know the source</em></li>
<li><strong>authority</strong> — capabilities granted from outside the image - <em>what we allow</em></li>
<li><strong>identity</strong> — desired state bound to one device and one generation - <em>what we actually run and where</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="10" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="what-a-wapp-actually-is">What a wapp actually is</h2>
<p>A <strong>wapp</strong> is an OCI image whose layers carry a <strong>WebAssembly module</strong> and its
read-only filesystem — pulled from an docker-compatible registry, exactly like
an usual container image. The packaging is the same.</p>
<ul>
<li><strong>One OS process, thread per workload</strong>: a running wapp is an interpreter
instance and a thread inside the engine.</li>
<li><strong>The image cannot ask for anything</strong>: a wapp image has no way to express a
request — its authority arrives in the launch config the supervisor installs.</li>
<li><strong>Same bytes, every target</strong>: the identical wapp runs on Linux and on a
Cortex-M33 with no recompile.</li>
</ul>
<p>The image is <strong>pure content</strong>. Everything an attacker would want to <em>grant</em> it,
lives in the desired state, transmitted on a secure channel, and signed.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="11" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="why-wasm-specifically">Why Wasm, specifically</h2>
<p>The isolation is a property of the <strong>instruction set</strong> — which matters when your
MCU has no MMU to build a ring with.</p>
<ul>
<li><strong>Bounds-checked linear memory</strong>: a wapp addresses only its own memory, every
access is checked by the interpreter. Enforced by WAMR.</li>
<li><strong>No W^X window at all</strong>: WAMR's classic interpreter mode means no code
generation — nothing to make writable-then-executable. Pays with perf.</li>
<li><strong>No ambient syscalls:</strong> the only host interface is the WASI bridge, and every
call routes through the VFS.</li>
</ul>
<p><strong>The honest limit:</strong> the interpreter is trusted. A WAMR vulnerability is an
engine vulnerability.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="12" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="one-continuous-chain">One continuous chain</h2>
<pre><code class="language-yaml"><span class="hljs-string">verified</span> <span class="hljs-string">boot</span>              <span class="hljs-comment"># silicon: bootrom + OTP</span>
     <span class="hljs-string">▼</span>
<span class="hljs-string">WANTED</span> <span class="hljs-string">Engine</span>  <span class="hljs-string">◀────</span> <span class="hljs-string">hardware-rooted</span> <span class="hljs-string">device</span> <span class="hljs-string">identity</span>
     <span class="hljs-string">▼</span>
<span class="hljs-string">signed</span> <span class="hljs-string">desired</span> <span class="hljs-string">state</span>       <span class="hljs-comment"># control plane and supervisor</span>
     <span class="hljs-string">▼</span>
<span class="hljs-string">signed</span> <span class="hljs-string">wapp</span>                <span class="hljs-comment"># checked at every load</span>
     <span class="hljs-string">▼</span>
<span class="hljs-string">caps-confined</span> <span class="hljs-string">execution</span>    <span class="hljs-comment"># Wasm linear memory + WASI</span>
</code></pre>
<p>Each hop is a distinct trust layer with its <strong>own key</strong> or its <strong>own gate</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="13" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="link-1--hardware-root-of-trust">Link 1 — Hardware root of trust</h2>
<ul>
<li><strong>RP2350:</strong> device identity sealed in on-die <strong>OTP</strong> behind bootrom-verified
<strong>signed boot</strong> (secp256k1 + a hardware SHA-256 accelerator). <strong>TrustZone-M</strong>
available to additionally isolate the control plane from workloads - not used
for now.</li>
</ul>
<p><strong>Two distinct, chained key layers:</strong></p>
<table>
<thead>
<tr>
<th>Layer</th>
<th>Key</th>
<th>Authorizes</th>
</tr>
</thead>
<tbody>
<tr>
<td>Boot (silicon)</td>
<td><strong>secp256k1</strong></td>
<td><em>firmware image</em></td>
</tr>
<tr>
<td>Control plane (WANTED)</td>
<td><strong>Ed25519</strong></td>
<td><em>runtime workloads</em></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="14" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="link-2--signed-control-plane">Link 2 — Signed control plane</h2>
<p>The on-device supervisor — <strong>Sheriff</strong> — accepts only <strong>Ed25519-signed desired
state</strong>.</p>
<ul>
<li>Monotonic <strong><code>generation</code></strong> counter — an old or equal generation is rejected.</li>
<li><strong><code>device_id</code></strong> bound into the signed payload — a valid signature for device A
is rejected on device B.</li>
<li>The signing input is the deterministic message payload <strong>excluding
the signature</strong> — spliced out before verify.</li>
</ul>
<p>Least-trust posture: <strong>only</strong> Sheriff holds credentials to the control plane.</p>
<p>Public control plane key is provisioned to the device's side during <strong>enrollment
process</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="15" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="link-3--signed-images-checked-at-every-load">Link 3 — Signed images, checked at every load</h2>
<p>Workloads ship as <strong>content-addressed OCI layers</strong>, SHA-256-verified in flight.</p>
<p>That is the easy half. The hard half is <strong>at rest</strong>: the bytes sat in flash
between the download and this boot.</p>
<p>So the engine re-checks on every load. The signed message binds <strong>identity to
content</strong>:</p>
<p><em>u8 len(name) | name | u8 len(version) | version | u8 count | digest₀ ..
digestₙ₋₁</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="16" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="link-3--signed-images-checked-at-every-load-cont">Link 3 — Signed images, checked at every load, cont.</h2>
<ul>
<li>The <strong>length prefixes</strong> are important: without them <code>foo</code>/<code>1.0</code> and
<code>foo1</code>/<code>.0</code> assemble the same bytes.</li>
<li>Binding name and version closes <strong>interposition</strong> — validly signed bytes
installed under <em>another</em> image's reference verify against a real key, and
would be accepted by a payload that named only the bytes.</li>
<li>The verifying keyring is <strong>compiled into the firmware</strong>, so whatever covers
the firmware covers the keys:
<ul>
<li>multiple slots, so a key can be retired without stranding images signed by
the old one,</li>
<li>changing the keyring itself takes a firmware update.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="17" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="link-4--capability-confinement">Link 4 — Capability confinement</h2>
<p>Every workload runs in a <strong>WASI sandbox with no ambient authority</strong>. Hardware,
network, and filesystem exist only as <strong>explicitly mounted, policy-authorized
capabilities</strong> — a Plan 9-inspired VFS where <em>if a node isn't mounted, it's
invisible.</em> Example grant in desired state:</p>
<pre><code class="language-json"><span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;mounts&quot;</span><span class="hljs-punctuation">:</span>  <span class="hljs-punctuation">[</span><span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;name&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;platform&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;path&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;/data&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;options&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;ro&quot;</span> <span class="hljs-punctuation">}</span><span class="hljs-punctuation">]</span><span class="hljs-punctuation">,</span>   <span class="hljs-comment">// /data (ro)</span>
  <span class="hljs-attr">&quot;drivers&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">[</span><span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;name&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;gpio&quot;</span> <span class="hljs-punctuation">}</span><span class="hljs-punctuation">]</span><span class="hljs-punctuation">,</span>       <span class="hljs-comment">// /dev/gpio</span>
  <span class="hljs-attr">&quot;sockets&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">[</span><span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;name&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;uplink&quot;</span><span class="hljs-punctuation">,</span>        <span class="hljs-comment">// /net/uplink</span>
    <span class="hljs-attr">&quot;address&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;tcps://192.168.1.1:8443&quot;</span> <span class="hljs-punctuation">}</span><span class="hljs-punctuation">]</span> 
<span class="hljs-punctuation">}</span> 
</code></pre>
<p>That grant <strong>is</strong> the capability set — no more, no less.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="18" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="power-on-to-a-wapp-running-rp2350-example">Power-on to a wapp running (RP2350 example)</h2>
<ol>
<li>Bootrom loads the sealed firmware, verifies with <em>secp256k1</em></li>
<li><em>WantedStart()</em> parses config, mounts the namespaces</li>
<li>Supervisor image gets loaded.</li>
<li>Supervisor fetches desired state from the control plane: <em>Ed25519</em> signature,
<em>generation</em>, <em>device_id</em></li>
<li>Supervisor installs the image and its signature into the registry.
<em>SHA-256</em>-summed over the install stream, recorded beside the image</li>
<li>Engine loads the image, layers re-hashed, image <strong>signature verified
against the firmware keyring</strong></li>
<li>WAMR instantiates the module, allocates mem, imports WASI funcs</li>
<li>Launch config applied, entrypoint runs, the config <em>is the capability set</em> —
mounts, drivers, sockets</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="19" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="the-ota-update-is-where-the-chain-often-breaks">The OTA update is where the chain often breaks</h2>
<p>Verified boot proves the image <strong>you already have</strong>. The interesting question
is: <em>what authorizes the image you are about to become?</em></p>
<p>On the RP2350 the bootrom answers it with <strong>A/B slots and Try-Before-You-Buy¹</strong>:</p>
<ul>
<li>The new image is staged into the slot that is <strong>not</strong> running.</li>
<li>It is marked <strong>provisional</strong>. The loader boots it <em>on trial</em>.</li>
<li>If nothing confirms it, the next reset <strong>reverts to the previous slot.</strong> A bad
update costs a reboot.</li>
</ul>
<p><br /><br />
<span style="font-size:0.6em">1. <em>RP2350 Datasheet, §5.1.17 &quot;Try Before You Buy&quot;
(p.355)</em></span></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="20" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="the-demo">The demo</h2>
<p><strong>Live, on an Adafruit Feather RP2350</strong> — no network stack on the board:</p>
<ul>
<li>it <strong>enrolls</strong> — a one-use join token redeemed for a per-device secret</li>
<li><strong>Ed25519-verified desired state</strong> arrives over that cable</li>
<li>a <strong>signed wapp</strong> is published, signature-checked by the control plane,
carried over the same cable, and run</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="mekops" lang="pl-PL" data-marpit-pagination="21" style="--paginate:true;--theme:mekops;" data-marpit-pagination-total="22">
<h2 id="takeaways">Takeaways</h2>
<ol>
<li>A verified boot story is <strong>incomplete</strong> for any device that loads post-boot
workloads, this is <strong>runtime trust gap</strong>.</li>
<li>Carrying hardware-rooted trust into a content-addressed, signed software
supply chain on constrained MCUs <strong>is possible</strong>.</li>
<li><strong>Capability-based and memory confinements</strong> (WASI / Plan 9-like VFS) on
bounds-checked Wasm memory is the runtime complement to verified boot — least
privilege, and a hard memory wall.</li>
<li><strong>Verify at load, not at download</strong> - an in-flight digest proves what
arrived, only an at-rest check proves what is about to run.</li>
</ol>
</section>
